<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <!-- Outer double ring -->
  <circle cx="200" cy="200" r="190" stroke="#000000" stroke-width="4" fill="#ffffff" />
  <circle cx="200" cy="200" r="178" stroke="#000000" stroke-width="1.5" fill="none" />
  <circle cx="200" cy="200" r="130" stroke="#000000" stroke-width="2" fill="none" />
  <circle cx="200" cy="200" r="124" stroke="#000000" stroke-width="1" stroke-dasharray="3 3" fill="none" />

  <!-- Circular text path definitions -->
  <defs>
    <path id="textPathTop" d="M 45,200 A 155,155 0 0,1 355,200" />
    <path id="textPathBottom" d="M 355,200 A 155,155 0 0,1 45,200" />
  </defs>

  <!-- Outer Ring Text in Solid Black -->
  <text font-family="'Times New Roman', Georgia, serif" font-size="14.5" font-weight="bold" fill="#000000" letter-spacing="3.5">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      BARIN ELECTRONIC NOTARIZATION FACILITY
    </textPath>
  </text>
  <text font-family="'Times New Roman', Georgia, serif" font-size="12" font-weight="bold" fill="#000000" letter-spacing="2.5">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      • SUPREME COURT A.M. NO. 24-10-14-SC •
    </textPath>
  </text>

  <!-- 8-Point Law Stars on perimeter -->
  <g fill="#000000">
    <polygon points="200,16 203,24 211,24 205,29 207,37 200,32 193,37 195,29 189,24 197,24" />
    <polygon points="200,368 203,376 211,376 205,381 207,389 200,384 193,389 195,381 189,376 197,376" />
    <polygon points="24,200 32,203 32,211 37,205 45,207 40,200 45,193 37,195 32,189 32,197" />
    <polygon points="376,200 384,203 384,211 389,205 397,207 392,200 397,193 389,195 384,189 384,197" />
  </g>

  <!-- Central Emblem: Pillar, Scales of Justice & Digital Lex -->
  <!-- Base pedestal -->
  <rect x="145" y="275" width="110" height="12" fill="#000000" rx="1" />
  <rect x="155" y="267" width="90" height="8" fill="#333333" rx="1" />
  <rect x="165" y="261" width="70" height="6" fill="#000000" rx="1" />

  <!-- Center Pillar -->
  <path d="M 194,145 L 206,145 L 204,261 L 196,261 Z" fill="#000000" />
  <circle cx="200" cy="138" r="8" fill="#000000" />
  <circle cx="200" cy="138" r="4" fill="#ffffff" />

  <!-- Balance Beam -->
  <path d="M 130,152 Q 200,146 270,152 L 270,156 Q 200,150 130,156 Z" fill="#000000" />

  <!-- Left Scale Pan & Strings -->
  <line x1="130" y1="154" x2="110" y2="198" stroke="#000000" stroke-width="1.5" />
  <line x1="130" y1="154" x2="150" y2="198" stroke="#000000" stroke-width="1.5" />
  <path d="M 104,198 Q 130,212 156,198 Z" fill="#000000" />
  <line x1="104" y1="198" x2="156" y2="198" stroke="#000000" stroke-width="1.5" />

  <!-- Right Scale Pan & Strings -->
  <line x1="270" y1="154" x2="250" y2="198" stroke="#000000" stroke-width="1.5" />
  <line x1="270" y1="154" x2="290" y2="198" stroke="#000000" stroke-width="1.5" />
  <path d="M 244,198 Q 270,212 296,198 Z" fill="#000000" />
  <line x1="244" y1="198" x2="296" y2="198" stroke="#000000" stroke-width="1.5" />

  <!-- Center Open Law Codex / Book of Statutes -->
  <g transform="translate(160, 210)">
    <!-- Left page -->
    <path d="M 40,32 Q 20,24 0,28 L 0,62 Q 20,58 40,66 Z" fill="#ffffff" stroke="#000000" stroke-width="1.75" />
    <!-- Right page -->
    <path d="M 40,32 Q 60,24 80,28 L 80,62 Q 60,58 40,66 Z" fill="#ffffff" stroke="#000000" stroke-width="1.75" />
    <!-- Center spine -->
    <line x1="40" y1="32" x2="40" y2="66" stroke="#000000" stroke-width="2" />
    <!-- Text lines on left page -->
    <line x1="6" y1="37" x2="34" y2="35" stroke="#000000" stroke-width="1" />
    <line x1="6" y1="43" x2="34" y2="41" stroke="#000000" stroke-width="1" />
    <line x1="6" y1="49" x2="34" y2="47" stroke="#000000" stroke-width="1" />
    <!-- Text lines on right page -->
    <line x1="46" y1="35" x2="74" y2="37" stroke="#000000" stroke-width="1" />
    <line x1="46" y1="41" x2="74" y2="43" stroke="#000000" stroke-width="1" />
    <line x1="46" y1="47" x2="74" y2="49" stroke="#000000" stroke-width="1" />
  </g>

  <!-- Cryptographic Hash Shield / Keyhole at Top -->
  <path d="M 200,105 L 214,111 L 214,124 Q 200,133 200,133 Q 186,124 186,111 L 186,111 Z" fill="#000000" />
  <circle cx="200" cy="116" r="2.5" fill="#ffffff" />
  <line x1="200" y1="117" x2="200" y2="123" stroke="#ffffff" stroke-width="1.5" />

  <!-- Prominent Wordmark: BARIN -->
  <text x="200" y="306" font-family="'Times New Roman', Georgia, serif" font-size="21" font-weight="bold" fill="#000000" text-anchor="middle" letter-spacing="6">
    BARIN
  </text>
  <text x="200" y="321" font-family="'Arial', 'Helvetica', sans-serif" font-size="8.5" font-weight="bold" fill="#555555" text-anchor="middle" letter-spacing="3">
    LAW FIRM &amp; ENF
  </text>
</svg>
