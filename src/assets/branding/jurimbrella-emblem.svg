<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="goldGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBA73" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#A98338" />
    </linearGradient>
    <linearGradient id="navyGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112240" />
      <stop offset="100%" stop-color="#0B192C" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Circular Outer Shield Border -->
  <circle cx="256" cy="256" r="236" stroke="url(#goldGradLight)" stroke-width="6" fill="#F8FAFC" fill-opacity="0.85" />
  <circle cx="256" cy="256" r="222" stroke="#0B192C" stroke-opacity="0.15" stroke-width="2" fill="none" />

  <!-- Protective Umbrella Canopy (Arching gracefully at top) -->
  <g filter="url(#subtleShadow)">
    <!-- Apex Finial Tip -->
    <path d="M 256,76 L 260,94 L 252,94 Z" fill="url(#goldGradLight)" />
    <circle cx="256" cy="74" r="5" fill="url(#goldGradLight)" />

    <!-- Main Canopy Shell -->
    <path d="M 120,206 C 130,120 200,94 256,94 C 312,94 382,120 392,206 C 362,198 334,204 316,212 C 298,198 274,196 256,200 C 238,196 214,198 196,212 C 178,204 150,198 120,206 Z" 
          fill="url(#navyGradLight)" stroke="#0B192C" stroke-width="3" stroke-linejoin="round" />

    <!-- Canopy Rib Arches / Accents -->
    <path d="M 256,94 Q 256,150 256,200" stroke="url(#goldGradLight)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 256,94 Q 220,145 196,212" stroke="url(#goldGradLight)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.85" />
    <path d="M 256,94 Q 292,145 316,212" stroke="url(#goldGradLight)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.85" />
    <path d="M 256,94 Q 170,145 120,206" stroke="#0B192C" stroke-width="2.5" />
    <path d="M 256,94 Q 342,145 392,206" stroke="#0B192C" stroke-width="2.5" />
  </g>

  <!-- Legal Document Silhouette (Protected beneath the umbrella canopy) -->
  <g>
    <!-- Document Base with folded corner -->
    <path d="M 172,216 L 316,216 L 340,240 L 340,366 C 340,378 330,388 318,388 L 194,388 C 182,388 172,378 172,366 Z" 
          fill="#FFFFFF" stroke="#0B192C" stroke-width="4" stroke-linejoin="round" />
    <!-- Document Corner Fold -->
    <path d="M 316,216 L 316,240 L 340,240" fill="#E2E8F0" stroke="#0B192C" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Legal Text Rules on Document -->
    <line x1="202" y1="254" x2="310" y2="254" stroke="#0B192C" stroke-opacity="0.2" stroke-width="3" stroke-linecap="round" />
    <line x1="202" y1="274" x2="310" y2="274" stroke="#0B192C" stroke-opacity="0.2" stroke-width="3" stroke-linecap="round" />
    <line x1="202" y1="294" x2="270" y2="294" stroke="#0B192C" stroke-opacity="0.2" stroke-width="3" stroke-linecap="round" />
    <line x1="202" y1="314" x2="250" y2="314" stroke="#0B192C" stroke-opacity="0.2" stroke-width="3" stroke-linecap="round" />
    
    <!-- Legal Seal Stamp Badge on Document -->
    <circle cx="304" cy="336" r="18" fill="none" stroke="url(#goldGradLight)" stroke-width="3" stroke-dasharray="3,2" />
    <circle cx="304" cy="336" r="13" fill="url(#goldGradLight)" fill-opacity="0.2" />
    <path d="M 304,328 L 306,334 L 312,334 L 307,338 L 309,344 L 304,340 L 299,344 L 301,338 L 296,334 L 302,334 Z" fill="url(#goldGradLight)" />
  </g>

  <!-- Central Fountain Pen Nib & Signature Symbol (Stem & Nib anchored at bottom) -->
  <g filter="url(#subtleShadow)">
    <!-- Umbrella Shaft / Pen Body -->
    <path d="M 253,196 L 259,196 L 258,340 L 254,340 Z" fill="#0B192C" />
    
    <!-- Fountain Pen Nib Head (Pointing down toward signature line) -->
    <!-- Outer Nib Shoulders -->
    <path d="M 242,340 C 242,348 245,356 248,368 L 256,412 L 264,368 C 267,356 270,348 270,340 Z" 
          fill="url(#goldGradLight)" stroke="#0B192C" stroke-width="3" stroke-linejoin="round" />
    <!-- Nib Breather Hole -->
    <circle cx="256" cy="366" r="3.5" fill="#0B192C" />
    <!-- Nib Center Slit -->
    <line x1="256" y1="369.5" x2="256" y2="411" stroke="#0B192C" stroke-width="2.5" stroke-linecap="round" />
    <!-- Nib Engraving Line -->
    <path d="M 248,354 C 252,358 260,358 264,354" fill="none" stroke="#0B192C" stroke-width="2" stroke-linecap="round" />
    
    <!-- Dynamic Flourishing Signature Curve under the Nib -->
    <path d="M 186,428 C 220,412 248,416 256,412 C 266,408 284,424 326,422" 
          fill="none" stroke="url(#goldGradLight)" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>